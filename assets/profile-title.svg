<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Kuş Bakışı</title>
  <desc id="desc">Kuş Bakışı, Birdman, Vogelmann. Her türden oyuna farklı bir bakış.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset=".52" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#21070d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset=".48" stop-color="#f0f6fc"/>
      <stop offset="1" stop-color="#ff304f"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="238" rx="22" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <g fill="none" stroke="#2f81f7" stroke-width="2" opacity=".34">
    <path d="M0 0 155 118M0 44 122 124M38 0 159 92M0 102 116 142"/>
    <path d="M0 0C56 32 99 72 155 118M0 44C45 61 83 89 122 124M38 0C72 24 114 58 159 92"/>
    <path d="M1200 0 1045 118M1200 44 1078 124M1162 0 1041 92M1200 102 1084 142"/>
  </g>
  <g fill="none" stroke="#ff304f" stroke-width="2" opacity=".34">
    <path d="M1200 0C1144 32 1101 72 1045 118M1200 44C1155 61 1117 89 1078 124M1162 0C1128 24 1086 58 1041 92"/>
  </g>

  <text x="600" y="82" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="7">KUŞ BAKIŞI</text>
  <rect x="330" y="102" width="540" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>

  <g text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="1.6">
    <text x="600" y="143" fill="#f0f6fc">BIRDMAN • VOGELMANN</text>
    <text x="600" y="176" fill="#8cbbf5">A DIFFERENT VIEW OF GAMES</text>
    <text x="600" y="209" fill="#ff8b9c">EIN ANDERER BLICK AUF SPIELE</text>
  </g>
</svg>
